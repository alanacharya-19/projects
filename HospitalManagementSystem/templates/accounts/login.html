{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hospital Management System</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-icon">+</span>
            <span class="brand-text">MediCare HMS</span>
        </div>
        <h1>Sign in to your account</h1>
        <p class="muted">Hospital Management System</p>

        {% if form.errors %}
            <div class="alert alert-error">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                       class="form-control" autofocus required>
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                       class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <p class="muted auth-footer">Staff accounts are created by the system administrator.</p>
    </div>
</body>
</html>
