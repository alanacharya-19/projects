{% extends 'base.html' %}
{% block title %}Delete {{ medicine.name }} | Pharmacy{% endblock %}

{% block content %}
<div class="page-header"><div><h1>Delete Medicine</h1></div></div>

<div class="panel confirm-panel">
    <p>Are you sure you want to delete <strong>{{ medicine.name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'pharmacy:medicine_detail' medicine.pk %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
