<form method="get" class="filter-bar" style="box-shadow:none; padding:0; margin-bottom:0; border:none; background:none">
    <div class="form-group">
        <label for="{{ form.start_date.id_for_label }}">{{ form.start_date.label }}</label>
        {{ form.start_date }}
    </div>
    <div class="form-group">
        <label for="{{ form.end_date.id_for_label }}">{{ form.end_date.label }}</label>
        {{ form.end_date }}
    </div>
    <div class="filter-submit">
        <button type="submit" class="btn btn-primary">Apply</button>
        <a href="{{ reset_url }}" class="btn btn-outline">Reset</a>
        <a href="{{ export_url }}" class="btn btn-outline">Export CSV</a>
    </div>
</form>
