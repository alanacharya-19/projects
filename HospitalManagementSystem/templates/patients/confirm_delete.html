{% extends 'base.html' %}
{% block title %}Delete Patient | Hospital Management System{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Delete Patient</h1>
    </div>
</div>

<div class="panel confirm-panel">
    <p>Are you sure you want to delete <strong>{{ patient.full_name }}</strong>? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'patients:detail' patient.pk %}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
